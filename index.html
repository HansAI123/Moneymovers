<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        function shouldSuppress(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return s.indexOf('websocket') !== -1 ||
                 s.indexOf('closed without opened') !== -1 ||
                 s.indexOf('@vite/client') !== -1 ||
                 s.indexOf('vite-hmr') !== -1;
        }
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason) {
            var msg = e.reason.message || String(e.reason);
            if (shouldSuppress(msg)) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          }
        }, true);
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? e.message : '';
          var src = (e && e.filename) ? e.filename : '';
          if (shouldSuppress(msg) || shouldSuppress(src)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
